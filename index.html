<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Fellow in Edge</title>
<style>
body{font-family:system-ui,sans-serif;text-align:center;padding:3rem 1.5rem}
a.btn{display:inline-block;margin-top:1.5rem;padding:.9rem 1.6rem;border-radius:8px;background:#0f6cbd;color:#fff;text-decoration:none;font-size:1.1rem}
small{display:block;margin-top:1.5rem;color:#666}
</style></head>
<body>
<h2>Open Fellow in Edge</h2>
<a id="go" class="btn" href="#">Open in Edge</a>
<small id="fb"></small>
<script>
var APP_ID = "17cfc6a7-5950-492f-a02a-23945ff24ff3";
var web = "https://portal.manage.microsoft.com/webcp/apps/" + APP_ID;
var intent = "intent://portal.manage.microsoft.com/webcp/apps/" + APP_ID +
  "#Intent;scheme=https;package=com.microsoft.emmx;" +
  "S.browser_fallback_url=" + encodeURIComponent(web) + ";end";
document.getElementById("go").href = intent;
document.getElementById("fb").innerHTML =
  'Edge not opening? <a href="' + web + '">Open in your default browser</a>';
</script>
</body></html>
