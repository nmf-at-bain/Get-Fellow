<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Fellow in Company Portal</title>
<style>body{font-family:system-ui,sans-serif;text-align:center;padding:3rem 1.5rem}
a.btn{display:inline-block;margin-top:1.5rem;padding:.9rem 1.6rem;border-radius:8px;background:#0f6cbd;color:#fff;text-decoration:none;font-size:1.1rem}
small{display:block;margin-top:1.5rem;color:#666}</style></head>
<body><h2>Get Fellow</h2>
<a id="go" class="btn" href="#">Open in Company Portal</a>
<small id="fb"></small>
<script>
var IOS_ID="940b5333-0db0-44ab-b212-169145ac1f60", AND_ID="17cfc6a7-5950-492f-a02a-23945ff24ff3";
var ua=navigator.userAgent||"", go=document.getElementById("go"), web;
if(/android/i.test(ua)){
  web="https://portal.manage.microsoft.com/apps/"+AND_ID;
  go.href="intent://portal.manage.microsoft.com/apps/"+AND_ID+"#Intent;scheme=https;package=com.microsoft.windowsintune.companyportal;S.browser_fallback_url="+encodeURIComponent(web)+";end";
}else{
  web="https://portal.manage.microsoft.com/apps/"+IOS_ID;
  go.href=web;
}
document.getElementById("fb").innerHTML='Not opening? <a href="'+web+'">Open the web Company Portal</a>';
</script></body></html>
